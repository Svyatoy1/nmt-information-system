services:

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: nmt_user
      POSTGRES_PASSWORD: nmt_password
      POSTGRES_DB: nmt_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U nmt_user -d nmt_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  app:
    build: .

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://nmt_user:nmt_password@db:5432/nmt_db

    depends_on:
      db:
        condition: service_healthy


  prometheus:
    image: prom/prometheus:v3.15.0

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - app


volumes:
  postgres_data: